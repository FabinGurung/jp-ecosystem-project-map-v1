name: Validate operational map data

on:
  push:
    branches:
      - main
      - v1.2-operational-map
      - v1.2-project-data-integration
    paths:
      - "*.csv"
      - "map-config.json"
      - "index.html"
      - "assets/**"
      - "imports/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-projects.yml"
  pull_request:
    paths:
      - "*.csv"
      - "map-config.json"
      - "index.html"
      - "assets/**"
      - "imports/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-projects.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate normalized CSV and configuration data
        run: python scripts/validate_data.py

      - name: Run Python regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/csv.js
          node --check assets/js/app.js

      - name: Run JavaScript CSV tests
        run: node --test tests/*.test.mjs
