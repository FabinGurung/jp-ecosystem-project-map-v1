<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="JP Ecosystem public operational project map">
  <title>JP Ecosystem Operational Project Map</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin>
  <link rel="stylesheet" href="assets/css/app.css?v=1.2.0-dev-20260803-1">
  <link rel="stylesheet" href="assets/css/site-operations-prototype.css?v=1.2.0-dev-20260819-1">
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="app-header">
      <div class="header-main">
        <div class="title-wrap">
          <div class="eyebrow">
            <span>JP Ecosystem</span>
            <span class="version-badge" id="version-badge">v1.2.0-dev</span>
          </div>
          <h1 id="site-title">Operational Project Map</h1>
          <p id="site-subtitle">Loading public project information…</p>
        </div>
        <div class="metrics" aria-live="polite">
          <div class="metric"><strong id="visible-count">0</strong><span>visible</span></div>
          <div class="metric"><strong id="public-count">0</strong><span>projects</span></div>
          <div class="metric"><strong id="updated-date">—</strong><span>updated</span></div>
        </div>
      </div>

      <button class="button filter-toggle" id="filter-toggle" type="button"
              aria-expanded="false" aria-controls="map-controls">Filters</button>

      <div class="controls" id="map-controls">
        <div class="control search-control">
          <label for="search-input">Search project, code, ward, or company</label>
          <input id="search-input" type="search" autocomplete="off"
                 placeholder="Example: FBL-023, road, Ward 20, or Bhalam">
        </div>
        <div class="control">
          <label for="status-filter">Status</label>
          <select id="status-filter"><option value="">All statuses</option></select>
        </div>
        <div class="control">
          <label for="sector-filter">Sector</label>
          <select id="sector-filter"><option value="">All sectors</option></select>
        </div>
        <div class="control">
          <label for="function-filter">Function</label>
          <select id="function-filter"><option value="">All functions</option></select>
        </div>
        <div class="control">
          <label for="company-filter">Company</label>
          <select id="company-filter"><option value="">All companies</option></select>
        </div>
        <button class="button" id="reset-button" type="button">Reset</button>
        <button class="button" id="list-toggle" type="button"
                aria-expanded="true" aria-controls="project-pane">Hide list</button>
        <button class="button button-primary" id="download-button" type="button">Download GeoJSON</button>
      </div>
    </header>

    <main class="workspace" id="workspace">
      <aside class="project-pane" id="project-pane" aria-label="Public project list">
        <div class="public-notice" id="public-notice"></div>
        <div class="legend-block">
          <div class="legend-title">Status colours</div>
          <div class="status-legend" id="status-legend" role="group" aria-label="Project status legend"></div>
        </div>
        <div class="legend-block">
          <div class="legend-title">Marker functions</div>
          <div class="function-legend" id="function-legend" role="group" aria-label="Project function marker legend"></div>
        </div>
        <div class="list-heading">
          <h2>Projects</h2>
          <span id="list-count">0</span>
        </div>
        <div class="project-list" id="project-list"></div>
      </aside>

      <section class="map-stage" aria-label="Interactive project map">
        <div id="map"></div>
        <div id="map-message" class="map-message" role="alert"></div>
        <div class="map-layer-control" aria-label="Map layers">
          <strong>Map layers</strong>
          <label><input id="layer-projects" type="checkbox" checked> Projects</label>
          <label><input id="layer-opportunities" type="checkbox" checked> Opportunities</label>
          <label><input id="layer-locations" type="checkbox" checked> Offices</label>
        </div>
        <button class="map-list-button" id="map-list-button" type="button">Projects</button>
      </section>

      <aside class="detail-panel" id="detail-panel" aria-label="Selected project details" inert>
        <div class="sheet-handle" aria-hidden="true"></div>
        <header class="detail-header">
          <div>
            <div class="detail-code" id="detail-code">—</div>
            <h2 id="detail-title">Select a project</h2>
            <p id="detail-subtitle"></p>
          </div>
          <button class="icon-button" id="detail-close" type="button" aria-label="Close project details">×</button>
        </header>

        <div class="detail-tabs" role="tablist" aria-label="Project information sections">
          <button class="detail-tab active" id="tab-overview" type="button" role="tab"
                  aria-selected="true" aria-controls="panel-overview" data-tab="overview">Overview</button>
          <button class="detail-tab" id="tab-works" type="button" role="tab"
                  aria-selected="false" aria-controls="panel-works" data-tab="works">
            Schedule &amp; Progress <span class="tab-count" id="works-tab-count">0</span>
          </button>
          <button class="detail-tab" id="tab-materials" type="button" role="tab"
                  aria-selected="false" aria-controls="panel-materials" data-tab="materials">
            Resources <span class="tab-count" id="materials-tab-count">0</span>
          </button>
        </div>

        <div class="detail-body">
          <section class="tab-panel active" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
          <section class="tab-panel" id="panel-works" role="tabpanel" aria-labelledby="tab-works" hidden></section>
          <section class="tab-panel" id="panel-materials" role="tabpanel" aria-labelledby="tab-materials" hidden></section>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin></script>
  <script type="module" src="assets/js/app.js?v=1.2.0-dev-20260803-1"></script>
  <script type="module" src="assets/js/m01-schedule-gantt.js?v=1.0.0-dev-20260830-1"></script>
  <script type="module" src="assets/js/m02-progress-report.js?v=1.0.0-dev-20260831-1"></script>
  <script type="module" src="assets/js/m03-material-readiness.js?v=1.0.0-dev-20260831-1"></script>
  <script type="module" src="assets/js/site-operations-prototype.js?v=1.2.0-dev-20260819-1"></script>
</body>
</html>
